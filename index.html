<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Dashboard - Admin & Server</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#0a0a0c] text-white antialiased">

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 bg-[#0a0a0c]/85 backdrop-blur-md border-b border-[#22222a]">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <button id="menuBtn" class="focus:outline-none"><svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
                <span class="font-bold tracking-tight">Phantom Dashboard</span>
            </div>
            <div id="authContainer">
                <a id="discordLoginBtn" href="#" class="text-xs bg-[#5865F2] hover:bg-[#4752C4] text-white font-semibold px-4 py-2 rounded-xl transition-all inline-flex items-center space-x-2">
                    <span>Mit Discord verifizieren</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Sidebar -->
    <div id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-[#121216] border-r border-[#22222a] z-[60] transform -translate-x-full transition-transform duration-300 ease-in-out p-6 flex flex-col justify-between">
        <div>
            <div class="flex justify-between items-center mb-8">
                <span class="font-bold text-sm text-gray-200">Menü</span>
                <button id="closeBtn" class="text-gray-400 text-xl font-bold p-1 focus:outline-none hover:text-white">✕</button>
            </div>
            
            <ul class="space-y-4 text-gray-300 text-sm">
                <li><a href="#" class="hover:text-blue-400">Übersicht</a></li>
                <li><a href="#servers" class="hover:text-blue-400">Server-Liste</a></li>
                <li><a href="https://discord.com/oauth2/authorize?client_id=1534677160873296064&permissions=8&integration_type=0&scope=bot+applications.commands" target="_blank" class="block text-blue-400 font-semibold mt-4">Bot einladen</a></li>
            </ul>
            
            <!-- Admin Menü (Wird per Script freigeschaltet) -->
            <div id="adminMenuSection" class="mt-8 pt-6 border-t border-[#22222a] hidden">
                <div class="text-[10px] text-red-400 mb-2 uppercase font-bold">Owner Steuerung</div>
                <button id="toggleAdminBtn" class="text-red-400 font-semibold text-sm text-left w-full hover:text-red-300">⚡ Admin Panel öffnen</button>
            </div>
        </div>
    </div>

    <div id="overlay" class="fixed inset-0 bg-black/50 z-[50] hidden"></div>

    <!-- Admin Panel Popup -->
    <section id="admin-panel" class="fixed inset-0 z-[70] flex items-center justify-center p-6 hidden">
        <div class="bg-[#121216] border border-red-500/40 p-6 rounded-2xl w-full max-w-sm shadow-2xl">
            <h2 class="text-sm font-bold text-red-400 mb-4 uppercase">⚡ Admin Management</h2>
            <p class="text-[11px] text-gray-400 mb-4">Verwaltung für deinen Bot (Owner Mode aktiv).</p>

            <a href="https://top.gg/bot/1534677160873296064" target="_blank" 
               class="block w-full bg-[#1a1a20] border border-[#333] p-4 rounded-xl text-sm hover:border-blue-500 transition-colors mb-4">
               <div class="font-bold text-blue-400">Bot-Server Liste</div>
            </a>

            <button onclick="document.getElementById('admin-panel').classList.add('hidden')" class="w-full text-gray-500 text-[10px] hover:text-white border border-transparent hover:border-gray-600 py-2 rounded-xl transition-all">Panel schließen</button>
        </div>
    </section>

    <!-- Hauptinhalt -->
    <section class="px-6 pt-12 pb-4 max-w-md mx-auto">
        <h1 class="text-3xl font-extrabold mb-6">Phantom <span class="text-blue-500">Dashboard</span></h1>
        <div class="bg-[#121216] border border-[#22222a] p-5 rounded-2xl mb-4">
            <h3 class="text-[10px] text-gray-500 uppercase font-bold mb-2">System Status</h3>
            <div class="flex items-center justify-between">
                <span class="text-sm text-gray-300">Bot Verbindung</span>
                <span class="text-green-500 text-xs font-bold px-2 py-1 bg-green-500/10 rounded-full">ONLINE</span>
            </div>
        </div>
    </section>

    <script>
        const ownerID = "1523728380476919910";
        const CLIENT_ID = "1534677160873296064";
        const redirectUri = window.location.origin + window.location.pathname;
        const discordLoginUrl = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=token&scope=identify`;
        
        document.getElementById('discordLoginBtn').href = discordLoginUrl;

        const fragment = new URLSearchParams(window.location.hash.substring(1));
        const accessToken = fragment.get('access_token');

        if (accessToken) {
            localStorage.setItem('discord_token', accessToken);
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        async function checkAuth() {
            const token = localStorage.getItem('discord_token');
            if (token) {
                try {
                    const response = await fetch('https://discord.com/api/users/@me', {
                        headers: { authorization: `Bearer ${token}` }
                    });
                    if (response.ok) {
                        const user = await response.json();
                        document.getElementById('authContainer').innerHTML = `<span class="text-xs text-gray-400">Eingeloggt als ${user.username}</span>`;
                        if (user.id === ownerID) {
                            document.getElementById('adminMenuSection').classList.remove('hidden');
                        }
                    }
                } catch (e) { localStorage.removeItem('discord_token'); }
            }
        }

        checkAuth();

        // UI Listener
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const adminPanel = document.getElementById('admin-panel');
        
        menuBtn.addEventListener('click', () => { sidebar.classList.remove('-translate-x-full'); overlay.classList.remove('hidden'); });
        overlay.addEventListener('click', () => { sidebar.classList.add('-translate-x-full'); overlay.classList.add('hidden'); });
        document.getElementById('closeBtn').addEventListener('click', () => { sidebar.classList.add('-translate-x-full'); overlay.classList.add('hidden'); });
        document.getElementById('toggleAdminBtn').addEventListener('click', () => { adminPanel.classList.remove('hidden'); sidebar.classList.add('-translate-x-full'); overlay.classList.add('hidden'); });
    </script>
</body>
</html>
