<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Dashboard - Admin & Server</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#0a0a0c] text-white antialiased">

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 bg-[#0a0a0c]/85 backdrop-blur-md border-b border-[#22222a]">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <button id="menuBtn" class="focus:outline-none"><svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
            <span class="font-bold tracking-tight">Phantom Dashboard</span>
        </div>
    </nav>

    <!-- Sidebar -->
    <div id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-[#121216] border-r border-[#22222a] z-[60] transform -translate-x-full transition-transform duration-300 ease-in-out p-6 flex flex-col justify-between">
        <div>
            <div class="flex justify-between items-center mb-8"><span class="font-bold text-sm text-gray-200">Menü</span><button id="closeBtn" class="text-gray-400">✕</button></div>
            <ul class="space-y-4 text-gray-300 text-sm">
                <li><a href="#" class="hover:text-blue-400">Übersicht</a></li>
                <li><a href="#servers" class="hover:text-blue-400">Server-Liste</a></li>
                <li><a href="https://discord.com/oauth2/authorize?client_id=1534677160873296064&permissions=8&integration_type=0&scope=bot+applications.commands" target="_blank" class="block text-blue-400 font-semibold mt-4">Bot einladen</a></li>
            </ul>
            <div id="adminMenuSection" class="mt-8 pt-6 border-t border-[#22222a] hidden">
                <div class="text-[10px] text-red-400 mb-2 uppercase">Owner Steuerung</div>
                <button id="toggleAdminBtn" class="text-red-400 font-semibold text-sm">⚡ Admin Panel öffnen</button>
            </div>
        </div>
    </div>

    <div id="overlay" class="fixed inset-0 bg-black/50 z-[50] hidden"></div>

    <!-- Admin Panel (Standard hidden) -->
    <section id="admin-panel" class="px-6 pb-6 pt-12 hidden">
        <div class="max-w-md mx-auto bg-[#121216] border border-red-500/40 p-6 rounded-2xl">
            <h2 class="text-sm font-bold text-red-400 mb-4 uppercase">⚡ Admin Management</h2>
            
            <div class="space-y-3 mb-6">
                <div class="flex justify-between items-center bg-[#1a1a20] p-3 rounded-xl border border-[#22222a]">
                    <span class="text-xs text-gray-300">Phantom Community</span>
                    <a href="https://discord.gg/MG3rYnUZJV" target="_blank" class="text-[10px] bg-blue-600 px-2 py-1 rounded">Join</a>
                </div>
                <div class="flex justify-between items-center bg-[#1a1a20] p-3 rounded-xl border border-[#22222a]">
                    <span class="text-xs text-gray-300">Gaming Lounge</span>
                    <a href="https://discord.com" target="_blank" class="text-[10px] bg-blue-600 px-2 py-1 rounded">Join</a>
                </div>
            </div>

            <button onclick="alert('Owner-Rolle wurde erfolgreich vom Bot angefordert und zugewiesen!')" class="w-full bg-yellow-600/20 border border-yellow-500/30 text-yellow-400 text-xs py-2 rounded-xl mb-2">Owner Rolle anfordern</button>
            <button onclick="document.getElementById('admin-panel').classList.add('hidden')" class="w-full text-gray-500 text-[10px]">Panel schließen</button>
        </div>
    </section>

    <!-- Bot Live Status Section -->
    <section class="px-6 pt-8 pb-4 max-w-md mx-auto">
        <div class="bg-[#121216] border border-[#22222a] p-4 rounded-2xl flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                </span>
                <div>
                    <div class="text-xs font-bold text-gray-200">Bot Live-Status</div>
                    <div class="text-[10px] text-green-400 font-mono">Online • Shard 07 Aktiv</div>
                </div>
            </div>
            <div class="text-right">
                <div class="text-[10px] text-gray-400">Latenz</div>
                <div class="text-xs font-mono font-bold text-blue-400">18 ms</div>
            </div>
        </div>
    </section>

    <!-- Main Content -->
    <header class="pt-4 pb-8 px-6 text-center">
        <h1 class="text-3xl font-extrabold mb-3">Deine aktiven <br><span class="text-blue-500">Bot-Server.</span></h1>
    </header>

    <script>
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const adminPanel = document.getElementById('admin-panel');
        
        menuBtn.addEventListener('click', () => { sidebar.classList.remove('-translate-x-full'); document.getElementById('overlay').classList.remove('hidden'); });
        document.getElementById('closeBtn').addEventListener('click', () => { sidebar.classList.add('-translate-x-full'); document.getElementById('overlay').classList.add('hidden'); });
        document.getElementById('toggleAdminBtn').addEventListener('click', () => { adminPanel.classList.remove('hidden'); sidebar.classList.add('-translate-x-full'); document.getElementById('overlay').classList.add('hidden'); });
        
        if ("1523728380476919910" === "1523728380476919910") {
            document.getElementById('adminMenuSection').classList.remove('hidden');
        }
    </script>
</body>
</html>
